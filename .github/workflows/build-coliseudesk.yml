name: Gerar ColiseuDesk.exe (Ultra-Leve ~115 KB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      rendezvous_server:
        description: 'IP ou Domínio da sua VPS (ex: 2.24.82.19)'
        required: false
        default: '2.24.82.19'
      rs_pub_key:
        description: 'Chave Pública gerada na VPS (id_ed25519.pub)'
        required: false
        default: '1p8++8VM24nZtyCrsIlylHxG4hRS5ZVRf3bkDmHaYg8='

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar ColiseuDesk Ultra-Leve (Windows)
    runs-on: windows-latest

    steps:
      - name: Baixar código do repositório ColiseuDesk
        uses: actions/checkout@v4

      - name: Compilar Executável Único Ultra-Leve (ColiseuDesk.exe ~115 KB)
        shell: pwsh
        run: |
          dotnet build src/ColiseuDesk/ColiseuDesk.csproj -c Release -o dist/ColiseuDesk
          Remove-Item "dist/ColiseuDesk/*.config", "dist/ColiseuDesk/*.pdb" -ErrorAction SilentlyContinue

      - name: Disponibilizar ColiseuDesk.exe para Download nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ColiseuDesk-UltraLeve
          path: |
            dist/ColiseuDesk/ColiseuDesk.exe
          retention-days: 30
