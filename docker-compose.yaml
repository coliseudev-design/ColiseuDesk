services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r ${RELAY_HOST:-2.24.82.19}:21117 -k _
    volumes:
      - coliseudesk-data:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr -k _
    volumes:
      - coliseudesk-data:/root
    ports:
      - "21117:21117"
      - "21119:21119"
    restart: unless-stopped

volumes:
  coliseudesk-data:
